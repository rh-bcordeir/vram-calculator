<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRAM calculator — Red Hat AI</title>
    <meta
      name="description"
      content="Estimate the GPU memory an LLM needs on vLLM: weights, KV cache and overhead, checked against real accelerator capacity."
    />
    <meta name="color-scheme" content="dark light" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Mono:wght@400;500;700&family=Red+Hat+Text:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Set the theme before first paint so the page never flashes the wrong one.
      // Dark is the default for this console.
      (function () {
        try {
          var saved = localStorage.getItem("vram-theme");
          document.documentElement.setAttribute("data-theme", saved || "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
